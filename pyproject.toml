[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "0.1.0"
description = "Vulnerability detection for C/C++ and Java with heterogeneous graph neural networks on code property graphs."
readme = "README.md"
authors = [{ name = "Divik Bhaskar" }]
license = { file = "LICENSE" }
keywords = ["vulnerability-detection", "graph-neural-networks", "code-property-graph", "static-analysis",
            "security", "pytorch-geometric", "joern", "codebert"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.10"
dependencies = [
    "tree-sitter",
    "tree-sitter-cpp==0.23.4",
    "tree-sitter-java==0.23.5",
    "transformers==5.16.1",
    "torch==2.13.0",
    "torch-geometric>=2.8.0,<2.9.0",
    "scikit-learn>=1.9.1,<2.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]
ui = ["streamlit>=1.40"]

[project.scripts]
aegis-parse = "aegis.parsing.ast_parser:main"
aegis-embed = "aegis.embeddings.codebert_embedder:main"
aegis-build-graph = "aegis.graphs.heterodata_builder:main"
aegis-build-training-graphs = "aegis.pipeline.build_training_graphs:main"
aegis-train = "aegis.training.trainer:main"
aegis-evaluate = "aegis.evaluation.compare:main"
aegis-scan = "aegis.scanning.scanner:main"
aegis-ui = "aegis.ui.launcher:main"

[project.urls]
Repository = "https://github.com/Hikunokyojin/aegis"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]  # zip() over equal-length per-node lists by construction

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # inline GraphML/source fixtures read better unwrapped
