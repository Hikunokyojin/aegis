# Optional "Sign in with Hugging Face" for GitHub-repository scans.
# Copy to .streamlit/secrets.toml (never commit that file) and fill in the
# values from a free Hugging Face OAuth app: https://huggingface.co/settings/applications/new
# Redirect URL: <your app URL>/oauth2callback
[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "a-long-random-string"
client_id = "your-hugging-face-oauth-client-id"
client_secret = "your-hugging-face-oauth-client-secret"
server_metadata_url = "https://huggingface.co/.well-known/openid-configuration"
